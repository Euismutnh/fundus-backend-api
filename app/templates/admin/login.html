{% extends "sqladmin/login.html" %}

{% block head_css %}
{{ super() }}
<style>
    /* Login Page Styling */
    body {
        background: linear-gradient(135deg, #0066CC 0%, #00B8D4 100%);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .login-container {
        background: #FFFFFF;
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        padding: 48px;
        max-width: 440px;
        width: 100%;
        margin: 20px;
    }

    .login-header {
        text-align: center;
        margin-bottom: 32px;
    }

    .login-header i {
        font-size: 3rem;
        color: #0066CC;
        margin-bottom: 16px;
    }

    .login-header h1 {
        font-size: 1.75rem;
        font-weight: 700;
        color: #1A1A1A;
        margin-bottom: 8px;
    }

    .login-header p {
        color: #666666;
        font-size: 0.95rem;
    }

    .form-group {
        margin-bottom: 24px;
    }

    .form-label {
        font-weight: 600;
        color: #1A1A1A;
        margin-bottom: 8px;
        display: block;
    }

    .form-control {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid #E0E0E0;
        border-radius: 10px;
        font-size: 1rem;
        transition: all 0.3s ease;
    }

    .form-control:focus {
        outline: none;
        border-color: #0066CC;
        box-shadow: 0 0 0 4px rgba(0, 102, 204, 0.1);
    }

    .btn-login {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #0066CC 0%, #004C99 100%);
        color: #FFFFFF;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 8px;
    }

    .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 102, 204, 0.3);
    }

    .btn-login:active {
        transform: translateY(0);
    }

    .alert {
        padding: 12px 16px;
        border-radius: 8px;
        margin-bottom: 20px;
        border: none;
    }

    .alert-danger {
        background-color: #FFEBEE;
        color: #C62828;
    }

    .login-footer {
        text-align: center;
        margin-top: 24px;
        padding-top: 24px;
        border-top: 1px solid #E0E0E0;
        color: #666666;
        font-size: 0.9rem;
    }

    /* Input Icons */
    .input-group {
        position: relative;
    }

    .input-group i {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: #666666;
        z-index: 10;
    }

    .input-group .form-control {
        padding-left: 44px;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-header">
        <i class="fa-solid fa-eye-dropper"></i>
        <h1>DR Detection Admin</h1>
        <p>Diabetic Retinopathy Detection System</p>
    </div>

    {% if error %}
    <div class="alert alert-danger">
        <i class="fa-solid fa-circle-exclamation"></i>
        {{ error }}
    </div>
    {% endif %}

    <form method="post">
        <div class="form-group">
            <label class="form-label" for="username">
                <i class="fa-solid fa-user"></i> Username
            </label>
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input 
                    type="text" 
                    class="form-control" 
                    id="username" 
                    name="username" 
                    placeholder="Enter your username"
                    required 
                    autofocus
                >
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="password">
                <i class="fa-solid fa-lock"></i> Password
            </label>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input 
                    type="password" 
                    class="form-control" 
                    id="password" 
                    name="password" 
                    placeholder="Enter your password"
                    required
                >
            </div>
        </div>

        <button type="submit" class="btn-login">
            <i class="fa-solid fa-right-to-bracket"></i> Sign In
        </button>
    </form>

    <div class="login-footer">
        <i class="fa-solid fa-shield-halved"></i> Secure Admin Access
    </div>
</div>
{% endblock %}
