{% extends "sqladmin/layout.html" %}

{% block head_css %}
{{ super() }}
<style>
    /* Modern Color Palette - Medical Theme */
    :root {
        --primary-color: #0066CC;
        --primary-dark: #004C99;
        --primary-light: #3385D6;
        --accent-color: #00B8D4;
        --success-color: #00C853;
        --warning-color: #FFB300;
        --danger-color: #E53935;
        --text-primary: #1A1A1A;
        --text-secondary: #666666;
        --bg-primary: #FFFFFF;
        --bg-secondary: #F5F7FA;
        --bg-sidebar: #1E293B;
        --border-color: #E0E0E0;
        --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.12);
    }

    /* Global Styles */
    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: var(--bg-secondary);
        color: var(--text-primary);
    }

    /* Sidebar Styling */
    .sidebar {
        background: linear-gradient(180deg, var(--bg-sidebar) 0%, #0F172A 100%);
        box-shadow: var(--shadow-lg);
    }

    .sidebar .nav-link {
        color: rgba(255, 255, 255, 0.8);
        padding: 12px 20px;
        margin: 4px 12px;
        border-radius: 8px;
        transition: all 0.3s ease;
        font-weight: 500;
    }

    .sidebar .nav-link:hover {
        background-color: rgba(255, 255, 255, 0.1);
        color: #FFFFFF;
        transform: translateX(4px);
    }

    .sidebar .nav-link.active {
        background: linear-gradient(135deg, var(--primary-color) 0%, var(--accent-color) 100%);
        color: #FFFFFF;
        box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3);
    }

    .sidebar .nav-link i {
        margin-right: 12px;
        width: 20px;
        text-align: center;
    }

    /* Brand/Logo Area */
    .sidebar .navbar-brand {
        padding: 24px 20px;
        font-size: 1.5rem;
        font-weight: 700;
        color: #FFFFFF;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        margin-bottom: 16px;
    }

    .sidebar .navbar-brand i {
        color: var(--accent-color);
        margin-right: 8px;
    }

    /* Main Content Area */
    .main-content {
        padding: 32px;
        min-height: 100vh;
    }

    /* Card Styling */
    .card {
        border: none;
        border-radius: 12px;
        box-shadow: var(--shadow);
        background-color: var(--bg-primary);
        margin-bottom: 24px;
        overflow: hidden;
    }

    .card-header {
        background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
        color: #FFFFFF;
        padding: 20px 24px;
        border: none;
        font-weight: 600;
        font-size: 1.1rem;
    }

    .card-body {
        padding: 24px;
    }

    /* Table Styling */
    .table {
        margin-bottom: 0;
    }

    .table thead th {
        background-color: var(--bg-secondary);
        color: var(--text-primary);
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.85rem;
        letter-spacing: 0.5px;
        border: none;
        padding: 16px;
    }

    .table tbody tr {
        transition: all 0.2s ease;
        border-bottom: 1px solid var(--border-color);
    }

    .table tbody tr:hover {
        background-color: var(--bg-secondary);
        transform: scale(1.01);
        box-shadow: var(--shadow);
    }

    .table tbody td {
        padding: 16px;
        vertical-align: middle;
        border: none;
    }

    /* Button Styling */
    .btn {
        border-radius: 8px;
        padding: 10px 20px;
        font-weight: 500;
        transition: all 0.3s ease;
        border: none;
    }

    .btn-primary {
        background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
        box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3);
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(0, 102, 204, 0.4);
    }

    .btn-success {
        background: linear-gradient(135deg, var(--success-color) 0%, #00A344 100%);
    }

    .btn-danger {
        background: linear-gradient(135deg, var(--danger-color) 0%, #C62828 100%);
    }

    .btn-warning {
        background: linear-gradient(135deg, var(--warning-color) 0%, #FF8F00 100%);
    }

    /* Form Styling */
    .form-control, .form-select {
        border: 2px solid var(--border-color);
        border-radius: 8px;
        padding: 12px 16px;
        transition: all 0.3s ease;
    }

    .form-control:focus, .form-select:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
    }

    .form-label {
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 8px;
    }

    /* Badge Styling */
    .badge {
        padding: 6px 12px;
        border-radius: 6px;
        font-weight: 500;
        font-size: 0.85rem;
    }

    /* Pagination */
    .pagination {
        gap: 8px;
    }

    .page-link {
        border: 2px solid var(--border-color);
        border-radius: 8px;
        color: var(--primary-color);
        padding: 8px 16px;
        transition: all 0.3s ease;
    }

    .page-link:hover {
        background-color: var(--primary-color);
        color: #FFFFFF;
        border-color: var(--primary-color);
        transform: translateY(-2px);
    }

    .page-item.active .page-link {
        background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
        border-color: var(--primary-color);
    }

    /* Search and Filter Bar */
    .search-bar {
        background-color: var(--bg-primary);
        padding: 20px;
        border-radius: 12px;
        box-shadow: var(--shadow);
        margin-bottom: 24px;
    }

    /* Stats Cards */
    .stat-card {
        background: linear-gradient(135deg, var(--primary-color) 0%, var(--accent-color) 100%);
        color: #FFFFFF;
        padding: 24px;
        border-radius: 12px;
        box-shadow: var(--shadow-lg);
        margin-bottom: 24px;
    }

    .stat-card h3 {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 8px;
    }

    .stat-card p {
        opacity: 0.9;
        margin: 0;
    }

    /* Navbar Top */
    .navbar-top {
        background-color: var(--bg-primary);
        box-shadow: var(--shadow);
        padding: 16px 32px;
        margin-bottom: 0;
    }

    .navbar-top .navbar-text {
        color: var(--text-secondary);
        font-weight: 500;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .main-content {
            padding: 16px;
        }
        
        .card-body {
            padding: 16px;
        }
    }

    /* Loading Animation */
    .spinner-border {
        color: var(--primary-color);
    }

    /* Alert Styling */
    .alert {
        border: none;
        border-radius: 12px;
        padding: 16px 20px;
        box-shadow: var(--shadow);
    }

    .alert-success {
        background-color: #E8F5E9;
        color: #2E7D32;
    }

    .alert-danger {
        background-color: #FFEBEE;
        color: #C62828;
    }

    .alert-warning {
        background-color: #FFF8E1;
        color: #F57C00;
    }

    .alert-info {
        background-color: #E3F2FD;
        color: #1565C0;
    }
</style>
{% endblock %}

{% block brand %}
<a class="navbar-brand" href="{{ admin.base_url }}">
    <i class="fa-solid fa-eye-dropper"></i>
    DR Detection Admin
</a>
{% endblock %}
