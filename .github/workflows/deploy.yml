name: Deploy Backend DR-Detection to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger dari GitHub UI

# Environment variables (non-secret values)
env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: dr-detection-api
  REGION: asia-southeast2
  ARTIFACT_REGISTRY: asia-southeast2-docker.pkg.dev
  REPOSITORY_NAME: docker-images
  IMAGE_NAME: backend-dr-detection

jobs:
  build-and-deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      # ===================================
      # 1. Checkout repository
      # ===================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ===================================
      # 2. Authenticate to Google Cloud
      # ===================================
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # ===================================
      # 3. Configure Docker for Artifact Registry
      # ===================================
      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      # ===================================
      # 4. Build Docker image
      # ===================================
      - name: Build Docker image
        run: |
          docker build \
            --tag ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --tag ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}:latest \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            .
          
          echo "✅ Docker image built successfully"

      # ===================================
      # 5. Push Docker image to Artifact Registry
      # ===================================
      - name: Push Docker image
        run: |
          docker push ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}:latest
          
          echo "✅ Docker image pushed to Artifact Registry"

      # ===================================
      # 6. Deploy to Cloud Run
      # ===================================
      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --service-account=${{ secrets.RUNTIME_SA_EMAIL }} \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --timeout=300 \
            --port=8080 \
            --set-env-vars="^##^PROJECT_NAME=Fundus AI Backend##API_V1_STR=/api/v1##DATABASE_URL=${{ secrets.DATABASE_URL }}##SECRET_KEY=${{ secrets.SECRET_KEY }}##ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}##REFRESH_TOKEN_EXPIRE_DAYS=${{ secrets.REFRESH_TOKEN_EXPIRE_DAYS }}##ADMIN_SECRET_KEY=${{ secrets.ADMIN_SECRET_KEY }}##ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}##ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}##SMTP_SERVER=smtp.gmail.com##SMTP_PORT=587##SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}##SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}##SENDER_EMAIL=${{ secrets.SMTP_USERNAME }}##AI_SERVICE_URL=https://fundus-api-service-165772118694.asia-southeast2.run.app##GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }}##ENVIRONMENT=production##GOOGLE_APPLICATION_CREDENTIALS="
          
          echo "✅ Deployment completed successfully"

      # ===================================
      # 7. Show deployment result
      # ===================================
      - name: Show service URL
        run: |
          echo ""
          echo "🎉 ================================================"
          echo "   DEPLOYMENT SUCCESSFUL!"
          echo "================================================"
          echo ""
          
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          
          echo "📍 Service URL:"
          echo "   $SERVICE_URL"
          echo ""
          echo "📚 API Documentation:"
          echo "   $SERVICE_URL/docs"
          echo ""
          echo "🔧 Admin Panel:"
          echo "   $SERVICE_URL/admin"
          echo ""
          echo "✅ Health Check:"
          echo "   $SERVICE_URL/health"
          echo ""
          echo "================================================"